<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar & Hero Section Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
    }
    .font-display {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white antialiased min-h-screen flex flex-col">

  <!-- NAVBAR PREVIEW -->
  <nav class="sticky top-0 z-50 w-full bg-black/95 backdrop-blur-xl">
      <div class="container mx-auto flex h-20 items-center justify-between px-6 md:px-10 gap-4">
          <div class="flex items-center gap-6 min-w-0 flex-1">
              <!-- Brand Logo with Modern Display Font -->
              <a href="#" class="flex items-center gap-2.5 font-display text-2xl md:text-3xl font-black tracking-tight text-white whitespace-nowrap shrink-0">
                  <span>MyBlog</span>
                  <span class="h-2.5 w-2.5 rounded-full bg-white animate-pulse"></span>
              </a>

              <!-- Desktop Navigation - Large, Bold Display Font on Single Line -->
              <div class="hidden lg:flex items-center gap-6 xl:gap-8 overflow-hidden">
                  <a href="#" class="font-display text-lg font-bold text-zinc-300 transition-colors hover:text-white tracking-wide whitespace-nowrap">Life Story</a>
                  <a href="#" class="font-display text-lg font-bold text-zinc-300 transition-colors hover:text-white tracking-wide whitespace-nowrap">Lifestyle</a>
                  <a href="#" class="font-display text-lg font-bold text-zinc-300 transition-colors hover:text-white tracking-wide whitespace-nowrap">Online Security</a>
                  <a href="#" class="font-display text-lg font-bold text-zinc-300 transition-colors hover:text-white tracking-wide whitespace-nowrap">Politics</a>
                  <a href="#" class="font-display text-lg font-bold text-zinc-300 transition-colors hover:text-white tracking-wide whitespace-nowrap">Research Lab</a>
                  <a href="#" class="font-display text-lg font-bold text-zinc-300 transition-colors hover:text-white tracking-wide whitespace-nowrap">Technology</a>
                  <a href="#" class="font-display text-lg font-bold text-zinc-300 transition-colors hover:text-white tracking-wide whitespace-nowrap">Books & Newsletters</a>
              </div>
          </div>

          <div class="flex items-center gap-4 shrink-0">
              <!-- Search Icon button -->
              <button class="p-2 text-zinc-400 hover:text-white transition-colors">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              </button>

              <a href="#" class="hidden md:flex items-center gap-2.5 font-display text-lg font-bold text-zinc-100 border border-zinc-700/80 bg-zinc-900/90 px-6 py-2.5 rounded-full hover:bg-white hover:text-black transition-all whitespace-nowrap">
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                  <span class="whitespace-nowrap">Sign In</span>
              </a>
          </div>
      </div>
  </nav>

  <!-- HERO SECTION PREVIEW -->
  <section class="relative flex-1 flex flex-col items-center justify-center overflow-hidden bg-black px-6 py-24 text-center text-white">
      <!-- Ambient Background Grid Pattern -->
      <div class="absolute inset-0 bg-[radial-gradient(#333333_1px,transparent_1px)] [background-size:28px_28px] opacity-35 pointer-events-none"></div>

      <!-- Soft Black & White Spotlight Glow -->
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 h-[500px] w-[500px] sm:h-[650px] sm:w-[650px] bg-white/[0.05] blur-[150px] rounded-full pointer-events-none"></div>
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-[250px] bg-gradient-to-b from-zinc-800/30 via-transparent to-transparent pointer-events-none"></div>

      <div class="relative z-10 max-w-5xl space-y-10">
          <!-- Micro-badge with subtle border & glassmorphism -->
          <div class="inline-flex items-center gap-2.5 rounded-full border border-zinc-700/80 bg-zinc-900/90 px-5 py-2 text-xs sm:text-sm font-medium text-zinc-300 backdrop-blur-md shadow-lg">
              <svg class="h-4 w-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
              <span class="tracking-widest uppercase text-xs font-semibold text-zinc-200">Thoughts, Stories & Ideas</span>
          </div>

          <!-- Main Hero Title - Single Line Bold Characters with Square Boxed S and T -->
          <h1 class="font-display text-4xl sm:text-6xl md:text-7xl lg:text-8xl xl:text-[6rem] font-black tracking-tight leading-none whitespace-nowrap flex items-center justify-center gap-3 sm:gap-5">
              <span class="inline-flex items-center text-white drop-shadow-[0_0_40px_rgba(255,255,255,0.3)]">
                  <span class="inline-flex items-center justify-center rounded-2xl border-2 border-white bg-white text-black w-11 h-11 sm:w-16 sm:h-16 md:w-20 md:h-20 lg:w-24 lg:h-24 mr-1 sm:mr-2 shadow-[0_0_35px_rgba(255,255,255,0.4)] shrink-0">
                      S
                  </span>
                  imple
              </span>
              <span class="inline-flex items-center text-zinc-100">
                  <span class="inline-flex items-center justify-center rounded-2xl border-2 border-zinc-600 bg-zinc-900/90 text-white w-11 h-11 sm:w-16 sm:h-16 md:w-20 md:h-20 lg:w-24 lg:h-24 mr-1 sm:mr-2 shadow-lg shrink-0">
                      T
                  </span>
                  houghts.
              </span>
          </h1>

          <!-- Subtitle - Big Readable Font -->
          <p class="mx-auto max-w-3xl text-xl sm:text-2xl md:text-3xl text-zinc-300 font-normal italic leading-relaxed tracking-wide">
              &ldquo;The monotony and solitude of a quiet life stimulates the creative mind.&rdquo; &ndash; Albert Einstein
          </p>

          <!-- Action Buttons with Big Typography & High Contrast -->
          <div class="flex flex-col items-center justify-center gap-5 pt-4 sm:flex-row">
              <a href="#" class="group flex items-center justify-center gap-3 rounded-full bg-white px-10 py-4 sm:px-12 sm:py-5 text-base sm:text-lg font-bold text-black transition-all duration-300 hover:bg-zinc-200 shadow-[0_0_35px_rgba(255,255,255,0.25)]">
                  <span>Read the Blog</span>
                  <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
              </a>
              <a href="#" class="flex items-center justify-center rounded-full border-2 border-zinc-700 bg-zinc-950/70 px-10 py-4 sm:px-12 sm:py-5 text-base sm:text-lg font-bold text-zinc-200 transition-all duration-300 hover:border-white hover:text-white hover:bg-zinc-900 backdrop-blur-md">
                  About Function
              </a>
          </div>
      </div>
  </section>

</body>
</html>
